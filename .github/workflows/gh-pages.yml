name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # 当向 main 分支推送时触发（如果是 master 分支请修改）
  workflow_dispatch:    # 允许你从 Actions 页面手动触发工作流

permissions:
  contents: write
  pages: write
  id-token: write

# 只允许一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # 重要！递归拉取主题子模块
          fetch-depth: 0
          
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true # 使用扩展版Hugo以支持SCSS
          
      - name: Build
        run: hugo --minify # 构建并压缩输出
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public # 上传构建产物

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4